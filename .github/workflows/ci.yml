name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore backend
        run: dotnet restore backend/SetlistSocial.Api.csproj

      - name: Restore backend tests
        run: dotnet restore backend.tests/SetlistSocial.Api.Tests.csproj

      - name: Build backend
        run: dotnet build backend/SetlistSocial.Api.csproj --no-restore

      - name: Run backend tests
        run: dotnet test backend.tests/SetlistSocial.Api.Tests.csproj --no-restore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: setlist_social_e2e
          POSTGRES_USER: setlist_social
          POSTGRES_PASSWORD: setlist_social_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U setlist_social -d setlist_social_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ASPNETCORE_ENVIRONMENT: Development
      E2E_DB_CONNECTION: Host=127.0.0.1;Port=5432;Database=setlist_social_e2e;Username=setlist_social;Password=setlist_social_e2e
      ConnectionStrings__DefaultConnection: Host=127.0.0.1;Port=5432;Database=setlist_social_e2e;Username=setlist_social;Password=setlist_social_e2e
      Database__Provider: PostgreSQL
      E2E__EnableTestAuth: "true"
      Google__ClientId: e2e-test-client-id
      Google__ClientSecret: e2e-test-client-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore backend
        run: dotnet restore backend/SetlistSocial.Api.csproj

      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.9

      - name: Apply E2E database migrations
        env:
          ConnectionStrings__DefaultConnection: Host=127.0.0.1;Port=5432;Database=setlist_social_e2e;Username=setlist_social;Password=setlist_social_e2e
          Database__Provider: PostgreSQL
        run: dotnet ef database update --project backend/SetlistSocial.Api.csproj --startup-project backend/SetlistSocial.Api.csproj

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Show E2E configuration
        run: |
          echo "Backend health URL: http://127.0.0.1:5050/api/health"
          echo "Frontend URL: http://127.0.0.1:5173"
          echo "E2E test auth enabled: ${E2E__EnableTestAuth}"
          echo "E2E database provider: ${Database__Provider}"
          echo "E2E database connection target: Host=127.0.0.1;Port=5432;Database=setlist_social_e2e;Username=setlist_social"

      - name: Run Playwright E2E tests
        working-directory: frontend
        env:
          ConnectionStrings__DefaultConnection: Host=127.0.0.1;Port=5432;Database=setlist_social_e2e;Username=setlist_social;Password=setlist_social_e2e
          Database__Provider: PostgreSQL
        run: npm run e2e
